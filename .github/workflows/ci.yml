name: Check pull request
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /preview-portfolio
          NEXT_PUBLIC_SITE_URL: https://example.github.io/preview-portfolio
          NEXT_TELEMETRY_DISABLED: "1"
